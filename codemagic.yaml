workflows:
  ios-keyboard:
    name: iOS Keyboard MVP v2
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate project
        script: xcodegen generate

      - name: Build iPhone version
        script: |
          xcodebuild \
            -project CustomKeyboardMVP.xcodeproj \
            -scheme CustomKeyboardMVP \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
