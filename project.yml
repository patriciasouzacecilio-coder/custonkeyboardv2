name: CustomKeyboardMVP
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  CustomKeyboardMVP:
    type: application
    platform: iOS
    sources:
      - KeyboardHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CustomKeyboardMVP
        INFOPLIST_FILE: KeyboardHost/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: KeyboardExtension

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CustomKeyboardMVP.KeyboardExtension
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
